name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  shexli:
    name: EGO pre-check (shexli)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install shexli
        run: |
          python3 -m venv venv
          . venv/bin/activate
          pip install -U shexli

      - name: Run shexli
        run: |
          . venv/bin/activate
          # Pass an absolute path: shexli >=… regressed and crashes with a
          # ValueError in package_path() when given a relative package dir
          # (it compares absolute file paths against the relative root).
          shexli "$PWD/usbee@bitcreed.us"

  unit-tests:
    name: Unit tests (gjs)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install gjs
        run: |
          sudo apt-get update
          sudo apt-get install -y gjs

      # Only self-contained tests run here: those importing solely gi://
      # modules. Tests whose targets import the gnome-shell extension
      # resource URI (resource:///org/gnome/shell/extensions/extension.js)
      # — e.g. tests/forward-compat.test.js, via device-store.js's gettext
      # import — can ONLY run inside gnome-shell, not bare CI gjs. Add new
      # CI-safe test files to this list as they appear.
      - name: Run unit tests
        run: |
          gjs --version
          gjs -m tests/dbus-client.test.js
          gjs -m tests/daemon-status.test.js
