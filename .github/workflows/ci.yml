name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  shexli:
    name: EGO pre-check (shexli)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install shexli
        run: |
          python3 -m venv venv
          . venv/bin/activate
          pip install -U shexli

      - name: Run shexli
        run: |
          . venv/bin/activate
          shexli usbee@bitcreed.us
