name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  shexli:
    name: EGO pre-check (shexli)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install shexli
        run: |
          python3 -m venv venv
          . venv/bin/activate
          # Pin tree-sitter <0.26: 0.26.0 segfaults (exit 139, no output) when
          # shexli parses prefs.js. Reproduced locally — same shexli 0.2.1 and
          # tree-sitter-javascript 0.25.0 on both sides, tree-sitter core the
          # only variable; the v2.5.0 tree that passed CI in June also crashes
          # under 0.26.0. Not a stack overflow (survives ulimit -s 65536), and
          # tree-sitter-javascript has no release past 0.25.0 to upgrade into.
          # Drop the pin once shexli ships a 0.26-compatible release.
          pip install -U shexli 'tree-sitter<0.26'

      - name: Run shexli
        run: |
          . venv/bin/activate
          # Pass an absolute path: shexli >=… regressed and crashes with a
          # ValueError in package_path() when given a relative package dir
          # (it compares absolute file paths against the relative root).
          shexli "$PWD/usbee@bitcreed.us"

  unit-tests:
    name: Unit tests (gjs)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install gjs
        run: |
          sudo apt-get update
          sudo apt-get install -y gjs

      # Only self-contained tests run here: those importing solely gi://
      # modules, plus the four zero-import policy modules
      # (src/daemon-status.js, src/property-policy.js, src/link-verdict.js,
      # src/notify-policy.js). Anything importing the gnome-shell extension
      # resource URI (resource:///org/gnome/shell/extensions/extension.js —
      # device-store.js, popover.js, notifier.js and friends, for gettext)
      # can ONLY run inside gnome-shell, so those files are covered by
      # source-level structural guards inside these suites instead. That is
      # also why the verdict, containment and notification logic lives in
      # the zero-import modules. Add new CI-safe test files to this list.
      - name: Run unit tests
        run: |
          gjs --version
          gjs -m tests/dbus-client.test.js
          gjs -m tests/daemon-status.test.js
          gjs -m tests/forward-compat.test.js
